<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C++ Tutor Test Harness</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: #0d1117;
    color: #e6edf3;
    font-family: Inter, sans-serif;
    padding: 32px;
  }

  .shell {
    max-width: 960px;
    margin: 0 auto;
  }

  h1 {
    margin: 0 0 8px;
    font-size: 32px;
  }

  p {
    color: #8b949e;
    margin: 0 0 24px;
  }

  .toolbar {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  button {
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    font-weight: 700;
    cursor: pointer;
    background: #39d5ff;
    color: #0d1117;
  }

  button:disabled {
    opacity: 0.6;
    cursor: wait;
  }

  .summary {
    font-family: 'JetBrains Mono', monospace;
    color: #39d5ff;
  }

  .panel {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 16px;
    padding: 24px;
  }

  .test-list {
    list-style: none;
    padding: 0;
    margin: 0;
    display: grid;
    gap: 12px;
  }

  .test-item {
    border-radius: 12px;
    padding: 14px 16px;
    border: 1px solid #30363d;
    background: rgba(255, 255, 255, 0.03);
  }

  .test-item.pass {
    border-color: #3fb950;
    color: #7ee787;
    background: rgba(63, 185, 80, 0.14);
  }

  .test-item.fail {
    border-color: #f85149;
    color: #ff7b72;
    background: rgba(248, 81, 73, 0.14);
  }

  .test-item.running {
    border-color: #d29922;
    color: #e5b567;
    background: rgba(210, 153, 34, 0.14);
  }
</style>
</head>
<body>
<div class="shell">
  <h1>Browser Test Harness</h1>
  <p>Runs lightweight regression checks for grading, timer behavior, and localStorage persistence. Existing saved progress is backed up and restored after the run.</p>
  <div class="toolbar">
    <button id="run-tests" type="button">Run Tests</button>
    <div id="test-summary" class="summary">Waiting to run...</div>
  </div>
  <div class="panel">
    <ul id="test-results" class="test-list"></ul>
  </div>
</div>
<script src="js/data.js"></script>
<script src="js/core/runtime.js"></script>
<script src="js/core/helpers.js"></script>
<script src="js/core/compiler.js"></script>
<script src="js/core/state.js"></script>
<script src="js/features/checkpoints.js"></script>
<script src="js/testing/harness.js"></script>
</body>
</html>
